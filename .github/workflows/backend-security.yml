name: Backend security QA

on:
  push:
    branches: [eidan, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecode_ci
          POSTGRES_USER: ecode_ci
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecode_ci -d ecode_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: ecode_ci
      POSTGRES_USER: ecode_ci
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      MONGO_URI: mongodb://127.0.0.1:27017/ecode_ci
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
      # Los tests corren con DEBUG=False (como producción); llave solo para CI
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      # Obligatoria con DEBUG=False: cifra las credenciales de los medios de pago (solo para CI)
      CLAVE_CIFRADO_CREDENCIALES: ci-only-clave-de-cifrado-no-usar-en-otro-lugar
      # El cliente de pruebas usa HTTP: sin esto, cada petición recibiría un 301 a HTTPS
      SECURE_SSL_REDIRECT: 'False'
      # Los tests de checkout no crean páginas legales; la regla se prueba con override_settings
      EXIGIR_PAGINAS_LEGALES: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput --verbosity 2
